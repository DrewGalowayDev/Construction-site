version: '3.8'

services:
  app:
    image: ${COOLIFY_CONTAINER_NAME:-owdqaoclh6cifbclmzlzpdpq}:${COOLIFY_BUILD_COMMIT_SHA:-latest}
    container_name: ${COOLIFY_CONTAINER_NAME:-topline-app}-${COOLIFY_BUILD_TIMESTAMP:-dev}
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      SESSION_SECRET: ${SESSION_SECRET}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_CURRENCY: ${PAYSTACK_CURRENCY:-KES}
      APP_URL: ${APP_URL}
    networks:
      - coolify
    volumes:
      - app-uploads:/app/uploads
    labels:
      - "coolify.managed=true"
      - "coolify.version=4.0"
      - "coolify.applicationId=${COOLIFY_RESOURCE_UUID}"
      - "coolify.type=application"

networks:
  coolify:
    external: true

volumes:
  app-uploads:
